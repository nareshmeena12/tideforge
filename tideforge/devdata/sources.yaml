D295:
  slug: infodengue
  country: BR
  index:
    url: https://raw.githubusercontent.com/kelvins/Municipios-Brasileiros/main/csv/municipios.csv
    read: {format: csv, dtype: {codigo_ibge: str, codigo_uf: str}}
    id: codigo_ibge
    strata: [codigo_uf]
  fetch:
    url_template: "https://info.dengue.mat.br/api/alertcity?geocode={series}&disease=dengue&format=csv&ew_start=1&ew_end=53&ey_start=2012&ey_end=2025"
    vars: {series: index}
    probe_vars: {series: "3304557"}
    rate_limit_s: 0.5
    retries: 5
  read: {format: csv}
  time: {col: data_iniSE}
  id: [_var_series]
  value: casos
  tasks: [{freq: W, how: sum}]
  select: {max_series: 500}
  confirm: []
  notes: "probe 2026-10-27: CSV columns data_iniSE, SE, casos_est, casos, ..., tempmin, umidmax, umidmed, umidmin, ...
          tempmed, tempmax, ... (weekly, newest first); the weather columns feed the covariate task infodengue_weather.
          Municipality list: a static copy, kelvins/Municipios-Brasileiros (MIT licence; 5,570 municipalities with IBGE
          code, name, lat / lon, state code), because IBGE's API timed out from NERSC twice (2026-10-27)."

