# tfbench per-dataset overrides (tideforge/tfbench/canon.py docstring lists the keys). Key = dataset_id (selection.csv).
#
# keep_filtered rows need a drop rule, else they are not built ("keep_filtered: no drop rule"). The rules below are
# DRAFTS written from the catalog's overlap text before any data was seen: drop_items is a regex on item_id (for wide
# tables the column name, for long tables the id values joined with "|"), drop_parts a regex on file paths inside the
# repo. Check each against BUILD_REPORT_A.md ("drop_items" counts in meta.json) after the first canon run.
# Rows marked "no rule yet" are left without one on purpose: the overlap cannot be expressed from names alone.

ashwingopalsamy_central_bank_policy_rates:
  drop_items: "(?i)(^|\\W)(US|USA|united.?states|fed|federal)(\\W|$)"
  note: "draft: drop the US fed funds rate (FRED / TIME)"

datonic_world_development_indicators_default:
  drop_items: "(?i)co2|life.?expect|touris|international.?arrival"
  note: "draft: drop CO2, life expectancy and tourism indicators (fev)"

kavelaltd_historysaid_global_economic:
  drop_items: "(?i)co2|life.?expect|touris"
  note: "draft: drop CO2, life expectancy and tourism indicators (fev)"

rogerdehe_klines_okx_futures_15m_1d:
  drop_items: "(?i)(^|\\W)(BTC|ETH|LTC|BCH)"
  drop_parts: "(?i)(^|/)(BTC|ETH|LTC|BCH)[-_/]"
  note: "draft: drop BTC, ETH, LTC, BCH pairs (TIME)"

tradecatlabs_binance_futures_ohlcv_2018_2026_candles_1m:
  drop_items: "(?i)(^|\\W)(BTC|ETH|LTC|BCH)"
  drop_parts: "(?i)(^|/)(BTC|ETH|LTC|BCH)"
  note: "draft: drop BTC, ETH, LTC, BCH (TIME)"

zalizedata_global_macro_trade_indicators_dataset:
  drop_items: "(?i)co2|life.?expect|touris"
  note: "draft: drop CO2, life expectancy and tourism indicators (fev)"

alinurdin_time_series_benchmark_eia_hourly_madrid_15min_webtris_15min_usgs_daily_usgs_continuous_hydat_daily_bom_daily_c:
  drop_parts: "(?i)aemo|opsd"
  note: "draft: drop aemo_dispatch_5min (TIME AEMO NEM) and opsd_load (ENTSO-E load, fev)"

marplan6_batgrad_pozzato_2022:
  drop_parts: "(?i)synthetic|pybamm|m50t"
  note: "draft: drop the synthetic PyBaMM subset"

zalizedata_us_grid_hourly_power_plants_dataset:
  drop_items: "(?i)ercot|(^|\\W)ERCO(\\W|$)"
  note: "draft: drop the ERCOT balancing authority (fev)"

cognitedata_ind_eval:
