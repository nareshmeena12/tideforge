# tfbench source groups (owner 2026-11-14, BUILD_REPORT review). A group = the same underlying source published under
# different repos / resolutions. Each group lies wholly in one split and has weight 1 per tier and split (its datasets
# share it equally). Groups that share a dataset are merged (union), so a multi-source collection joins every group it
# contains (thuml UTSD bundles whose parts exist separately are skipped in overrides.yaml, so they do not merge
# groups; owner 2026-11-14). Key = group name, value = dataset_ids (selection.csv). Datasets not listed form a group of their own.

