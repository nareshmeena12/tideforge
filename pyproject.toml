[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tideforge"
version = "0.0.1"
description = "Data and generator lab for the Fluxion-Tide time-series foundation model"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "scipy",
  "holidays",
]

[project.optional-dependencies]
eval = ["fev", "gluonts", "huggingface_hub", "matplotlib"]  # timebench: install from the TIME repo
dev = ["pytest"]
# E0.5 public models that share the core env (owner OK 2026-10-29; torch stays the pytorch module's). Toto-2.0 and TiRex-2
# have their own venvs: scripts/perlmutter/venvs/*.txt. Pins also in tideforge/eval/public_models/__init__.py (SPECS).
public = [
  "chronos-forecasting==2.3.2",
  "timesfm[torch]==3.0.2",
  "tirex-ts[cuda]==1.4.2",
  "timestral @ git+https://github.com/mistralai/timestral@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
]
test-sf = ["statsforecast"]  # test-only: checks naive_time against statsforecast (owner 2026-10-27); never core
# dev-set readers for single sources (owner OK 2026-10-31; never core): openpyxl for D339 Eurocontrol / D360 NYC sales (xlsx),
# pdfplumber for D014 Grid-India's PDF reports, used only if Grid-India's terms allow automated access
devdata = ["openpyxl==3.1.5", "pdfplumber==0.11.10"]

[tool.setuptools.packages.find]
include = ["tideforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs CUDA (skipped locally; run on Perlmutter)",
  "slow: minutes on CPU; run with --runslow",
]
